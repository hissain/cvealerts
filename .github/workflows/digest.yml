name: digest
on:
  schedule:
    - cron: "41 6 * * *"   # daily, after the 03:23 / 06:23 ingest runs
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't send, don't update last_digest_at)"
        type: boolean
        default: false

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get latest CVE data
        run: |
          git fetch origin data --depth=1
          git checkout origin/data -- site/data
      - name: Send digests
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
          MAIL_FROM_EMAIL: ${{ vars.MAIL_FROM_EMAIL }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          MAX_EMAILS_PER_RUN: ${{ vars.MAX_EMAILS_PER_RUN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/digest.mjs
