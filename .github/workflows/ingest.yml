name: ingest
on:
  schedule:
    - cron: "23 */3 * * *"   # every 3h, off the top of the hour (GitHub delays :00 runs under load)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Previous data lives on an orphan `data` branch (force-pushed each run so git history never grows).
      - name: Restore previous data
        run: |
          git fetch origin data --depth=1 || true
          git checkout origin/data -- site/data 2>/dev/null || echo "No previous data (first run)"

      - name: Ingest NVD + KEV + EPSS
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/ingest.mjs

      - name: Publish data branch
        run: |
          git config user.name "cvealert-bot"
          git config user.email "cvealert-bot@users.noreply.github.com"
          git checkout --orphan data-tmp
          git rm -rf --cached . -q
          git add -f site/data
          git commit -qm "data $(date -u +%FT%TZ)"
          git push -f origin data-tmp:data

      - name: Deploy site + API to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy   # working tree still has all files; only the git index was swapped
